            color: #0a0e1a;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 28px rgba(212, 175, 55, 0.15);
            margin-bottom: 12px;
            letter-spacing: 0.8px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
        }
        .btn-gold::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, #e6c552, #c9a22a);
        }
        
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 17px 24px;
            background: transparent;
            color: #d4af37;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.3s ease;
            border: 1.5px solid rgba(212, 175, 55, 0.12);
            letter-spacing: 0.8px;
        }
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.04);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.04);
        }
        .btn-icon {
            margin-right: 12px;
            font-size: 16px;

        .footer-note {

            color: #2a3348;
            margin-top: 25px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        .footer-note span {
            color: rgba(212, 175, 55, 0.15);
        }

        /* subtle border animation like SAMRAZYA */
        .container {
            animation: borderGlow 4s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(212, 175, 55, 0.08); }
            50% { border-color: rgba(212, 175, 55, 0.18); }
